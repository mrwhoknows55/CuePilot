[project]
name = "cuepilot"
version = "0.1.0"
description = "CuePilot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",
    "rumps>=0.4.0 ; sys_platform == 'darwin'",
    "scipy>=1.18.1 ; sys_platform == 'darwin'",
    "sounddevice>=0.5.6 ; sys_platform == 'darwin'",
]

[project.scripts]
cuepilot = "cuepilot:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]
